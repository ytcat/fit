name: Lion app validation
on:
  push:
    branches: [main, 'lion/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lion-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify core assets and local script references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          required = ['boxing-coach-v2.js','training-arena.js','boxing-routines.js']
          for name in required:
              assert Path(name).is_file(), f'Missing core module: {name}'
              assert name in html, f'Not referenced by index.html: {name}'
          missing = []
          for src in re.findall(r"""<script\b[^>]*\bsrc\s*=\s*["']([^"']+)""", html, re.I):
              src = src.split('?')[0].split('#')[0]
              if not src.startswith(('http:', 'https:', '//', 'data:')) and not Path(src).is_file():
                  missing.append(src)
          assert not missing, f'Missing local scripts: {missing}'
          print('Core assets and local script references OK')
          PY
      - name: JavaScript syntax check
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in
                ./qa/gotr-0031/tools/*.js|./qa/gotr-0076/goto.js|./qa/gotr-0076/start.js|./qa/gotr-0098/ceremony-browser.js)
                  # These helpers are evaluated as async function bodies in the browser.
                  node - "$file" <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const filename = process.argv[2];
          const body = fs.readFileSync(filename, 'utf8');
          new vm.Script(`(async () => {\n${body}\n})`, { filename, lineOffset: -1 });
          JS
                  ;;
                *) node --check "$file" ;;
              esac
            done
      - name: Motion, contact and application regressions
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: |
          tests=(tests/*.test.cjs)
          for ((index = SHARD; index < ${#tests[@]}; index += SHARD_COUNT)); do
            test_file="${tests[index]}"
            echo "Running $test_file"
            node "$test_file"
          done
  browser-regressions:
    name: Browser regressions (Chromium)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          # For a PR, test the proposed commit, not the public Pages build.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install pinned Playwright and Chromium
        shell: bash
        run: |
          tools="$RUNNER_TEMP/fit-playwright"
          npm install --prefix "$tools" --no-save playwright@1.56.1
          "$tools/node_modules/.bin/playwright" install --with-deps chromium
          printf 'NODE_PATH=%s\n' "$tools/node_modules" >> "$GITHUB_ENV"
      - name: Verify Chromium and WebGL can start
        shell: bash
        run: |
          node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({ args: ['--no-sandbox', '--enable-unsafe-swiftshader'] });
            try {
              const page = await browser.newPage();
              if (!await page.evaluate(() => Boolean(document.createElement('canvas').getContext('webgl2')))) {
                throw new Error('Chromium has no usable WebGL2 backend for the 3D game');
              }
            } finally {
              await browser.close();
            }
          })().catch(error => { console.error(error); process.exitCode = 1; });
          JS
      - name: Run five existing browser test paths (no skips)
        shell: bash
        run: |
          # These scripts serve their own loopback copy of the checked-out game.
          unset APP_URL
          result=0
          while IFS='|' read -r test marker; do
            echo "::group::Running $test"
            log="$(mktemp)"
            if ! node "$test" 2>&1 | tee "$log"; then
              echo "::error::$test failed"
              result=1
            elif grep -Eiq '^[[:space:]]*SKIP([[:space:]]|:)' "$log" || ! grep -Fq -- "$marker" "$log"; then
              echo "::error::$test did not confirm browser coverage"
              result=1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done <<'TESTS'
          tests/dream-market-films.test.cjs|PASS browser: films at their steps
          tests/story-clean-gym.test.cjs|PASS browser: clean-gym job
          tests/dream-bag-break.test.cjs|PASS browser: plays once
          tests/shop-preview-body.test.cjs|measurements, body drawn in every one
          tests/dream-street-life.test.cjs|PASS street film quality switch
          TESTS
          exit "$result"
  validate:
    runs-on: ubuntu-latest
    needs: [regressions, browser-regressions]
    if: ${{ always() }}
    steps:
      - name: Require Node and browser regression jobs to pass
        env:
          NODE_RESULT: ${{ needs.regressions.result }}
          BROWSER_RESULT: ${{ needs.browser-regressions.result }}
        run: test "$NODE_RESULT" = success && test "$BROWSER_RESULT" = success
