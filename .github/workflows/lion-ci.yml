name: Lion app validation
on:
  push:
    branches: [main, 'lion/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lion-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify core assets and local script references
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          required = ['boxing-coach-v2.js','training-arena.js','boxing-routines.js']
          for name in required:
              assert Path(name).is_file(), f'Missing core module: {name}'
              assert name in html, f'Not referenced by index.html: {name}'
          missing = []
          for src in re.findall(r"""<script\b[^>]*\bsrc\s*=\s*["']([^"']+)""", html, re.I):
              src = src.split('?')[0].split('#')[0]
              if not src.startswith(('http:', 'https:', '//', 'data:')) and not Path(src).is_file():
                  missing.append(src)
          assert not missing, f'Missing local scripts: {missing}'
          print('Core assets and local script references OK')
          PY
      - name: JavaScript syntax check
        shell: bash
        run: |
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 |
            while IFS= read -r -d '' file; do
              case "$file" in
                ./qa/gotr-0031/tools/*.js|./qa/gotr-0076/goto.js|./qa/gotr-0076/start.js|./qa/gotr-0098/ceremony-browser.js)
                  # These helpers are evaluated as async function bodies in the browser.
                  node - "$file" <<'JS'
          const fs = require('node:fs');
          const vm = require('node:vm');
          const filename = process.argv[2];
          const body = fs.readFileSync(filename, 'utf8');
          new vm.Script(`(async () => {\n${body}\n})`, { filename, lineOffset: -1 });
          JS
                  ;;
                *) node --check "$file" ;;
              esac
            done
      - name: Motion, contact and application regressions
        run: |
          for test in tests/*.test.cjs; do
            node "$test" || exit 1
          done
